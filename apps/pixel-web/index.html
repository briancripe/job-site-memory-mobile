<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Job Site Memory</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#17201b;background:#edf2ee}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:20px 16px 60px}header{margin-bottom:20px}.mode{display:inline-block;padding:6px 10px;border-radius:99px;background:#fff2bf;color:#594500;font-weight:700;font-size:.8rem}.card{background:white;border:1px solid #d6ded8;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 8px 24px #2036290d}h1{font-size:1.8rem;margin:10px 0 4px}h2{font-size:1.1rem;margin:0 0 12px}label{font-size:.84rem;font-weight:700;display:block;margin:12px 0 5px}input,textarea,button{font:inherit;width:100%;border-radius:12px}input,textarea{border:1px solid #aebbb2;padding:12px;background:#fbfdfb}textarea{min-height:74px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}button{border:0;padding:12px;font-weight:750;background:#24583b;color:white;cursor:pointer}button.secondary{background:#e4ebe6;color:#23402f}button.danger{background:#f5e4df;color:#7a2515}button:disabled{opacity:.45;cursor:not-allowed}.result{white-space:pre-wrap;background:#f3f6f4;padding:12px;border-radius:12px;margin-top:12px;font-size:.9rem}.candidate{margin-top:8px;text-align:left;background:#e1ece5;color:#183d29}.hidden{display:none}@media(max-width:420px){main{padding:14px 12px 48px}.card{padding:15px}.row{grid-template-columns:1fr}h1{font-size:1.55rem}}
  </style>
</head>
<body><main>
  <header><span class="mode">THROWAWAY DEMO · process memory only</span><h1>Job Site Memory</h1><p>Text-first field notes for a Pixel-sized screen. Nothing is durable until you preview and explicitly Commit.</p></header>
  <section class="card"><h2>1 · Observe</h2><label>Place</label><input id="place" value="Basement utility closet"><label>What is it?</label><input id="description" value="Chrome shutoff valve beside water heater"><label>Label (optional)</label><input id="label" placeholder='e.g. 3/4&quot; main shutoff'><button id="observe">Observe</button><div id="observeResult" class="result hidden"></div></section>
  <section class="card"><h2>2 · Ask</h2><label>Place or question context</label><input id="askPlace" value="Basement utility closet"><button id="ask">Ask memory</button><div id="candidates"></div><div id="askResult" class="result hidden"></div></section>
  <section class="card"><h2>3 · Lesson preview</h2><label>Lesson title</label><input id="title" value="Valve status at arrival"><label>What should the next tech know?</label><textarea id="claim">Verify the tag and valve position before restoring water.</textarea><label>Next question</label><input id="next" value="Is the downstream line holding pressure?"><button id="preview" disabled>Preview lesson</button><div id="previewResult" class="result hidden"></div><div class="row"><button id="discard" class="danger" disabled>Discard</button><button id="commit" disabled>Commit explicitly</button></div><div id="commitResult" class="result hidden"></div></section>
  <script>
    const $=id=>document.getElementById(id);let selected=null,token=null;
    async function post(path,data){const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const value=await r.json();if(!r.ok)throw new Error(value.error||r.statusText);return value}
    function show(id,value){$(id).textContent=typeof value==='string'?value:JSON.stringify(value,null,2);$(id).classList.remove('hidden')}
    $('observe').onclick=async()=>{try{const r=await post('/api/observe',{place_label:$('place').value,description:$('description').value,user_label:$('label').value});selected=r.object?.object_id;show('observeResult',r);$('preview').disabled=!selected}catch(e){show('observeResult',e.message)}};
    $('ask').onclick=async()=>{try{const r=await post('/api/ask',{place_label:$('askPlace').value,description:$('askPlace').value});$('candidates').replaceChildren();show('askResult',r);if(r.status==='resumed')select(r.object);for(const c of r.candidates||[]){const b=document.createElement('button');b.className='candidate';b.textContent=`${c.label} · ${c.place}`;b.onclick=async()=>{const resumed=await post('/api/ask',{object_id:c.object_id});select(resumed.object);show('askResult',resumed);$('candidates').replaceChildren()};$('candidates').append(b)}}catch(e){show('askResult',e.message)}};
    function select(object){selected=object.object_id;$('preview').disabled=false}
    $('preview').onclick=async()=>{try{const r=await post('/api/preview',{object_id:selected,title:$('title').value,claims:[{text:$('claim').value,confidence:.85}],next_question:$('next').value});token=r.preview_token;show('previewResult',r.draft);$('discard').disabled=false;$('commit').disabled=false}catch(e){show('previewResult',e.message)}};
    $('discard').onclick=async()=>{const r=await post('/api/discard',{preview_token:token});token=null;show('commitResult',r);$('discard').disabled=true;$('commit').disabled=true};
    $('commit').onclick=async()=>{try{const r=await post('/api/commit',{preview_token:token});token=null;show('commitResult',r);$('discard').disabled=true;$('commit').disabled=true}catch(e){show('commitResult',e.message)}};
  </script>
</main></body></html>
